<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ICA Student Support</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== BRAND COLORS (edit here) ===== */
  :root {
    --bg: #1a1718;          /* page background (charcoal) */
    --card: #262223;        /* cards / inputs */
    --card-2: #2f2a2b;      /* pressed card */
    --line: #3a3435;        /* borders */
    --text: #f4efe6;        /* main text */
    --hint: #a39a8c;        /* secondary text */
    --gold: #d4a73a;        /* main gold */
    --gold-light: #f6de8d;
    --gold-dark: #a8781c;
    --gold-grad: linear-gradient(135deg, #a8781c 0%, #f6de8d 45%, #c9962b 100%);
    --danger: #ff6b5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { font-family: "Cairo", -apple-system, "Segoe UI", Tahoma, sans-serif; color: var(--text); line-height: 1.55; min-height: 100vh; padding-bottom: 28px; }
  .wrap { padding: 0 16px; max-width: 560px; margin: 0 auto; }

  /* ===== TOP BAR ===== */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; max-width: 560px; margin: 0 auto; }
  .topbar img { width: 34px; height: auto; }
  .topbar .brand { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .topbar .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--hint); }
  .lang-btn { margin-inline-start: auto; border: 1px solid var(--gold); color: var(--gold-light); background: transparent; padding: 5px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; font-family: inherit; }

  /* ===== HERO (home only) ===== */
  .hero { position: relative; border-radius: 18px; overflow: hidden; margin: 4px 0 18px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .hero img { display: block; width: 100%; height: auto; }
  .hero .hero-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px; background: linear-gradient(transparent, rgba(20,17,18,.85)); }
  .hero .hero-text h1 { font-size: 20px; }
  .hero .hero-text p { font-size: 13px; color: #e0d6c3; }

  .section-title { font-size: 14px; color: var(--hint); margin: 6px 2px 10px; }
  h2 { font-size: 19px; margin-bottom: 4px; }
  .sub { color: var(--hint); font-size: 14px; margin-bottom: 16px; }

  /* ===== SCREENS ===== */
  .screen { display: none; animation: fade .22s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ===== BIG CATEGORY CARDS ===== */
  .big-card { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); font-size: 17px; font-weight: 600; cursor: pointer; text-align: start; font-family: inherit; overflow: hidden; }
  .big-card::before { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--gold-grad); }
  .big-card:active { background: var(--card-2); }
  .big-card .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(212,167,58,.12); border: 1px solid rgba(212,167,58,.35); flex-shrink: 0; }
  .big-card .txt small { display: block; font-size: 12.5px; font-weight: 400; color: var(--hint); }
  .big-card .arrow { margin-inline-start: auto; color: var(--gold); font-size: 22px; }
  [dir="rtl"] .big-card .arrow { transform: scaleX(-1); }
  .follow-card { background: transparent; border: 1px dashed var(--gold); }
  .follow-card::before { display: none; }

  /* ===== OPTIONS ===== */
  .opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 15px 16px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); font-size: 16px; cursor: pointer; text-align: start; font-family: inherit; }
  .opt:active { border-color: var(--gold); background: var(--card-2); }
  .opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--gold); flex-shrink: 0; }

  /* ===== INPUTS ===== */
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input[type=text], input[type=tel], textarea { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font-size: 16px; font-family: inherit; outline: none; }
  input:focus, textarea:focus { border-color: var(--gold); }
  textarea { min-height: 110px; resize: vertical; }
  ::placeholder { color: #756d62; }

  .main-btn { width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 14px; background: var(--gold-grad); color: #1a1718; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 6px 18px rgba(212,167,58,.25); }
  .main-btn:disabled { opacity: .55; }
  .ghost-btn { width: 100%; margin-top: 10px; padding: 13px; border: 1px solid var(--gold); border-radius: 14px; background: transparent; color: var(--gold-light); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .back-link { background: none; border: none; color: var(--gold-light); font-size: 15px; margin: 4px 0 12px; cursor: pointer; font-family: inherit; }

  /* ===== COMMITMENT ===== */
  .commit-box { background: var(--card); border: 1px solid var(--line); border-inline-start: 4px solid var(--gold); padding: 14px; border-radius: 12px; font-size: 15px; margin: 10px 0; }
  .copy-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold-light); border-radius: 10px; padding: 7px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .steps { margin: 16px 0 6px; padding-inline-start: 22px; font-size: 15px; }
  .steps li { margin-bottom: 6px; }
  .steps li::marker { color: var(--gold); font-weight: 700; }
  .upload { display: block; text-align: center; padding: 26px 12px; border: 2px dashed var(--gold-dark); border-radius: 14px; cursor: pointer; color: var(--gold-light); font-size: 15px; margin-top: 12px; background: rgba(212,167,58,.05); }
  .upload input { display: none; }
  .preview { display: none; width: 100%; border-radius: 12px; margin-top: 12px; border: 1px solid var(--line); }

  .select-wrap { position: relative; }
  .select-wrap::after { content: "▾"; position: absolute; inset-inline-end: 14px; top: 50%; transform: translateY(-50%); color: var(--gold); pointer-events: none; }
  select { width: 100%; padding: 13px 14px; padding-inline-end: 36px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font-size: 15px; font-family: inherit; outline: none; appearance: none; -webkit-appearance: none; }
  select:disabled { color: var(--hint); }
  select:focus { border-color: var(--gold); }
  input[type=date] { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font-size: 16px; font-family: inherit; color-scheme: dark; min-height: 50px; }
  .pills { display: flex; gap: 10px; }
  .pill { flex: 1; padding: 12px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .pill.on { background: var(--gold-grad); color: #1a1718; border-color: transparent; }
  .check.warn { background: transparent; border: 2px solid var(--gold); color: var(--gold-light); }
  .note { background: rgba(212,167,58,.08); border: 1px solid rgba(212,167,58,.3); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 8px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }

  /* ===== DONE ===== */
  .done-box { text-align: center; padding-top: 24px; }
  .done-box img { width: 80px; margin-bottom: 10px; }
  .check { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-grad); color: #1a1718; font-size: 32px; font-weight: 700; }
  .ticket { display: inline-block; font-size: 22px; font-weight: 700; color: var(--gold-light); margin: 10px 0; padding: 6px 18px; border: 1px solid var(--gold); border-radius: 12px; letter-spacing: 1px; }

  /* ===== MY REQUESTS ===== */
  .req { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .req .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .req .id { font-weight: 700; color: var(--gold-light); letter-spacing: .5px; }
  .req .date { font-size: 12.5px; color: var(--hint); }
  .req .what { font-size: 15px; margin: 6px 0 8px; }
  .badge { display: inline-block; font-size: 12.5px; padding: 3px 10px; border-radius: 20px; }
  .badge.wait { background: rgba(212,167,58,.15); color: var(--gold-light); border: 1px solid rgba(212,167,58,.4); }
  .badge.progress { background: rgba(90,160,255,.15); color: #9cc6ff; border: 1px solid rgba(90,160,255,.4); }
  .badge.solved { background: rgba(80,200,120,.15); color: #8fe0a9; border: 1px solid rgba(80,200,120,.4); }
  .req .reply { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; }
  .empty { text-align: center; color: var(--hint); padding: 40px 10px; }
  .empty img { width: 70px; opacity: .5; margin-bottom: 10px; }

  /* ===== STAFF ===== */
  .staff-link { display: block; margin: 18px auto 0; background: none; border: none; color: var(--hint); font-size: 13px; cursor: pointer; font-family: inherit; }
  input[type=password] { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font-size: 16px; font-family: inherit; outline: none; }
  .staff-head { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; }
  .staff-head > div { flex: 1; min-width: 0; }
  .mini-btn { border: 1px solid var(--gold); color: var(--gold-light); background: transparent; border-radius: 10px; padding: 7px 12px; font-size: 14px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
  .tab { flex-shrink: 0; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 13.5px; cursor: pointer; font-family: inherit; }
  .tab.on { background: var(--gold-grad); color: #1a1718; border-color: transparent; font-weight: 700; }
  .tab b { opacity: .7; margin-inline-start: 4px; }
  .search { margin-bottom: 12px; }
  .st-card { display: block; width: 100%; text-align: start; font-family: inherit; color: var(--text); cursor: pointer; }
  .kv { display: grid; grid-template-columns: 38% 1fr; gap: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 14.5px; margin: 10px 0 6px; }
  .kv dt { color: var(--hint); }
  .kv dd { margin: 0; word-break: break-word; }
  .photo-box img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--line); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--gold-grad); color: #1a1718; font-weight: 700; padding: 10px 18px; border-radius: 12px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; }

  /* =====================================================================
     SEASONS — clipart + motion (changes automatically by date)
     ===================================================================== */
  .topbar, .wrap { position: relative; z-index: 1; }
  #seasonFx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .hero-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
  .hero .hero-text { z-index: 3; }
  .season-art { position: absolute; top: 0; right: 0; width: 42%; max-width: 190px; pointer-events: none; z-index: 2; }
  .season-art svg { display: block; width: 100%; height: auto; overflow: visible; }
  .season-chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; margin-bottom: 4px; border-radius: 20px;
                 color: var(--season-ink, #f6de8d); background: rgba(20,17,18,.55); border: 1px solid var(--season, #d4a73a); }

  /* particles */
  .p { position: absolute; top: -40px; will-change: transform; }
  .p .sway { display: block; }
  .p svg { display: block; width: 100%; height: 100%; }
  .fall  { animation: fall linear infinite; }
  .rise  { top: auto; bottom: -30px; animation: rise linear infinite; }
  .sway  { animation: sway ease-in-out infinite alternate; }
  .spin  { animation: spin linear infinite; }
  .twinkle { animation: twinkle ease-in-out infinite alternate; }
  @keyframes fall { from { transform: translateY(-5vh); } to { transform: translateY(110vh); } }
  @keyframes rise { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateY(-105vh); opacity: 0; } }
  @keyframes sway { from { transform: translateX(calc(var(--amp) * -1)) rotate(-25deg); } to { transform: translateX(var(--amp)) rotate(35deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes twinkle { from { opacity: .25; transform: scale(.7); } to { opacity: 1; transform: scale(1.1); } }
  .hero-fx .fall { animation-name: fallHero; }
  @keyframes fallHero { from { transform: translateY(-20px); } to { transform: translateY(260px); } }

  /* hero clipart motion */
  .branch-sway { transform-origin: 100% 0; animation: branch 5s ease-in-out infinite alternate; }
  @keyframes branch { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
  .sun-rays { transform-origin: 150px 40px; animation: spin 40s linear infinite; }
  .sun-glow { transform-origin: 150px 40px; animation: pulse 3.5s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .35; transform: scale(.92); } to { opacity: .8; transform: scale(1.08); } }
  .flake-big { transform-origin: 140px 48px; animation: spin 30s linear infinite; }
  .icicle { animation: drip 3s ease-in-out infinite alternate; }
  @keyframes drip { from { opacity: .55; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    #seasonFx, .hero-fx { display: none; }
    .branch-sway, .sun-rays, .sun-glow, .flake-big, .icicle { animation: none; }
  }
</style>
</head>

  function t(k) { return (T[lang][k] !== undefined) ? T[lang][k] : k; }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function activate(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo(0, 0);
    if (tg && tg.BackButton) (id === "home" || id === "done" || id === "dup" || id === "staff") ? tg.BackButton.hide() : tg.BackButton.show();
  }
  function go(node, push = true) {
    if (push) stack.push(current);
    current = { screen: "step", node };
    renderStep(node);
    activate("step");
  }
  function goBack() {
    const prev = stack.pop();
    if (!prev || prev.screen === "home") return goHome();
    current = prev;
    if (prev.screen === "step") { renderStep(prev.node); activate("step"); }
    else activate(prev.screen);
  }
  function goHome() { stack = []; current = { screen: "home" }; activate("home"); }
  if (tg && tg.BackButton) tg.BackButton.onClick(() => {
    if (current.screen === "staffReq") return showStaffList();
    if (["requests", "staffLogin", "staff"].includes(current.screen)) return goHome();
    goBack();
  });

  function startCategory(cat) {
    data = { category: cat }; lastKeys = {};

    current = { screen: "home" };

  // =====================================================================
  function renderStep(id) {
    const n = FLOW[id];
    const el = document.getElementById("step");
    let h = `<button class="back-link" onclick="goBack()">${t("back")}</button>`;

    if (n.type === "choice") {
      h += `<h2>${t(n.q)}</h2><p class="sub">${t("choose_one")}</p>`;
      n.options.forEach((o, i) => { h += `<button class="opt" onclick="pick('${id}',${i})"><span class="dot"></span>${t(o.key)}</button>`; });
    }

    if (n.type === "text") {
      const val = data[n.field] || "";
      const ph = n.ph ? t(n.ph) : "";
      h += `<h2>${t(n.q)}</h2><p class="sub">${t(n.sub)}</p>`;
      h += n.short
        ? `<input type="text" id="f_text" value="${esc(val)}" placeholder="${esc(ph)}">`
        : `<textarea id="f_text" placeholder="${esc(ph)}">${esc(val)}</textarea>`;
      h += `<p class="error" id="err">${t("err_fill")}</p>`;
      h += `<button class="main-btn" onclick="nextText('${id}')">${t("next")}</button>`;
    }

    if (n.type === "date") {
      const today = new Date().toISOString().slice(0, 10);
      h += `<h2>${t(n.q)}</h2><p class="sub">${t(n.sub)}</p>`;
      h += `<input type="date" id="f_text" max="${today}" value="${esc(data[n.field] || "")}">`;
      h += `<p class="error" id="err">${t("err_date")}</p>`;
      h += `<button class="main-btn" onclick="nextDate('${id}')">${t("next")}</button>`;
    }

    if (n.type === "commit") {
      h += `<h2>${t("commit_title")}</h2><p class="sub">${t("commit_sub")}</p>
        <div class="commit-box">${t("commit_text")}</div>
        <button class="copy-btn" id="copyBtn" onclick="copyCommit()">${t("copy")}</button>
        <ol class="steps"><li>${t("step1")}</li><li>${t("step2")}</li><li>${t("step3")}</li></ol>
        <label class="upload"><span id="upLabel">${data.commitImage ? t("change") : t("upload")}</span>
          <input type="file" accept="image/*" onchange="onPhoto(this)"></label>
        <img class="preview" id="preview" ${data.commitImage ? `src="${data.commitImage}" style="display:block"` : ""} alt="">
        <p class="error" id="err">${t("err_image")}</p>
        <button class="main-btn" onclick="nextCommit('${id}')">${t("next")}</button>`;
    }

    if (n.type === "info") {
      h += `<h2>${t(n.q)}</h2><p class="sub">${t(n.sub)}</p>`;
      n.fields.forEach(f => {
        if (f === "semester" || f === "level") {
          const list = f === "semester" ? SEMESTERS : LEVELS;
          h += `<label>${t(f)}</label><div class="pills">` +
            list.map(l => `<button type="button" class="pill ${data[f] === l.value ? "on" : ""}" onclick="pickPill(this,'${f}','${l.value}')">${t(l.key)}</button>`).join("") + `</div>`;
          return;
        }
        if (f === "field") {
          h += `<label>${t("field")}</label><div class="select-wrap"><select id="f_field"></select></div>`;
          return;
        }
        const ph = T[lang][f + "_ph"] ? t(f + "_ph") : "";
        if (f === "visaProblem") {
          h += `<label>${t(f)}</label><textarea id="f_${f}" placeholder="${esc(ph)}">${esc(data[f] || "")}</textarea>`;
          return;
        }
        h += `<label>${t(f)}</label><input type="text" id="f_${f}" value="${esc(data[f] || prefill(f))}" placeholder="${esc(ph)}">`;
      });
      h += `<p class="error" id="err">${t("err_fill")}</p>`;
      h += `<button class="main-btn" id="sendBtn" onclick="submitInfo('${id}')">${t("send")}</button>`;
    }

    el.innerHTML = h;
    if (n.type === "info" && n.fields.includes("field")) updateFieldSelect();
  }

  // Fill the field-of-study list according to chosen level (+ semester)
  function availableFields() {
    return (FIELDS[data.level] || []).filter(x => !x.only || x.only === data.semester);
  }
  function updateFieldSelect() {
    const sel = document.getElementById("f_field"); if (!sel) return;
    if (!data.level) {
      sel.innerHTML = `<option value="">${t("field_first")}</option>`; sel.disabled = true; return;
    }
    const list = availableFields();
    if (!list.some(x => x.en === data.field)) data.field = "";
    sel.disabled = false;
    sel.innerHTML = `<option value="">${t("field_choose")}</option>` +
      list.map(x => `<option value="${esc(x.en)}" ${x.en === data.field ? "selected" : ""}>${esc(x[lang] || x.en)}</option>`).join("");
    sel.onchange = () => { data.field = sel.value; };
  }

  function pickPill(btn, f, v) {
    data[f] = v;
    btn.parentNode.querySelectorAll(".pill").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    updateFieldSelect();
  }
  function prefill(f) {
    if ((f === "name" || f === "name3") && user) return [user.first_name, user.last_name].filter(Boolean).join(" ");
    return "";
  }

  // =====================================================================
  //  ACTIONS
  // =====================================================================
  function pick(id, i) {
    const n = FLOW[id], o = n.options[i];
    data[n.field] = T.en[o.key];      // saved in English for your sheet
    lastKeys[n.field] = o.key;
    go(o.next || n.next);
  }
  function nextText(id) {
    const n = FLOW[id], v = document.getElementById("f_text").value.trim();
    if (!v) return showErr();
    data[n.field] = v;
    go(n.next);
  }
  function nextDate(id) {
    const n = FLOW[id], v = document.getElementById("f_text").value;
    const today = new Date().toISOString().slice(0, 10);
    if (!v || v > today) return showErr();
    data[n.field] = v;
    go(n.next);
  }
  function showErr() { document.getElementById("err").style.display = "block"; }

  function copyCommit() {
    const text = t("commit_text");
    const done = () => { const b = document.getElementById("copyBtn"); b.textContent = t("copied"); setTimeout(() => b.textContent = t("copy"), 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const a = document.createElement("textarea"); a.value = text; document.body.appendChild(a);
    a.select(); document.execCommand("copy"); a.remove(); done();
  }

  function compressImage(file) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const max = 1280; let w = img.width, h = img.height;
        if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", 0.8));
      };
      img.src = URL.createObjectURL(file);
    });
  }
  async function onPhoto(input) {
    const file = input.files[0]; if (!file) return;
    data.commitImage = await compressImage(file);
    const p = document.getElementById("preview"); p.src = data.commitImage; p.style.display = "block";
    document.getElementById("upLabel").textContent = t("change");
    document.getElementById("err").style.display = "none";
  }
  function nextCommit(id) {
    if (!data.commitImage) return showErr();
    go(FLOW[id].next);
  }

  function makeTicketId() {
    const d = new Date();
    const date = d.getFullYear().toString().slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
    return "T" + date + "-" + Math.floor(1000 + Math.random() * 9000);
  }

  async function submitInfo(id) {
    const n = FLOW[id];
    for (const f of n.fields) {
      if (f === "level" || f === "semester" || f === "field") { if (!data[f]) return showErr(); continue; }
      const v = document.getElementById("f_" + f).value.trim();
      if (!v) return showErr();
      data[f] = v;
    }
    data.fullName = data.name || data.name3;
    const nameKey = normName(data.fullName), passKey = normPass(data.passport || data.studentId);

    // 1) quick check on this phone: same section + same name + same passport
    const mine = await loadRequests();
    if (mine.some(r => r.cat === data.category && r.nameKey === nameKey && r.passKey === passKey)) return showDuplicate();
    // keep only answers from the path the student actually took (ignore abandoned branches)
    const path = stack.filter(s => s.screen === "step").map(s => s.node).concat([id]);
    const allowed = new Set(["category", "fullName"].concat(n.fields));
    path.forEach(p => { if (FLOW[p].field) allowed.add(FLOW[p].field); if (FLOW[p].type === "commit") allowed.add("commitImage"); });
    Object.keys(data).forEach(k => { if (!allowed.has(k)) delete data[k]; });
    Object.keys(lastKeys).forEach(k => { if (!allowed.has(k)) delete lastKeys[k]; });

    data.ticketId = makeTicketId();
    data.telegramId = user ? user.id : "";
    data.username = user && user.username ? user.username : "";
    data.lang = lang;
    data.date = new Date().toISOString();

    const btn = document.getElementById("sendBtn");
    btn.disabled = true; btn.textContent = t("sending");
    try {
      // 2) real check on the server (Google Sheet) — covers every student
      if (SCRIPT_URL) {
        const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(data) });
        const out = await res.json();
        if (out.duplicate) { btn.disabled = false; btn.textContent = t("send"); return showDuplicate(); }
        if (!out.ok) throw new Error(out.error || "server");
      }
      await saveRequest({
        id: data.ticketId, cat: data.category, date: data.date,
        keys: Object.values(lastKeys), status: "wait", nameKey, passKey
      });
      document.getElementById("ticketId").textContent = data.ticketId;
      stack = []; current = { screen: "done" };
      activate("done");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    } catch (err) {
      btn.disabled = false; btn.textContent = t("send");
      if (tg) tg.showAlert(t("err_net")); else alert(t("err_net"));
    }
  }

  // Same name written with different spaces/capitals counts as the same name
  function normName(s) { return String(s || "").toLowerCase().replace(/[\u064B-\u0652]/g, "").replace(/[أإآ]/g, "ا").replace(/\s+/g, " ").trim(); }
  function normPass(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  function showDuplicate() {
    stack = []; current = { screen: "dup" };
    activate("dup");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("warning");
  }

  // =====================================================================
  //  MY REQUESTS (saved in the student's Telegram cloud storage)
  // =====================================================================
  const STORE_KEY = "ica_requests";
  function loadRequests() {
    return new Promise(resolve => {
      const parse = s => { try { return JSON.parse(s) || []; } catch (e) { return []; } };
      if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) {
        tg.CloudStorage.getItem(STORE_KEY, (err, v) => resolve(err ? localList() : parse(v)));
      } else resolve(localList());
      function localList() { try { return parse(localStorage.getItem(STORE_KEY)); } catch (e) { return []; } }
    });
  }
  async function saveRequest(r) {
    let list = await loadRequests();
    list.unshift(r);
    list = list.slice(0, 15);  // keep last 15
    const s = JSON.stringify(list);
    try { localStorage.setItem(STORE_KEY, s); } catch (e) {}
    if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) {
      await new Promise(res => tg.CloudStorage.setItem(STORE_KEY, s, () => res()));
    }
  }
  async function openRequests(fromDone) {
    if (!fromDone) { stack = [{ screen: "home" }]; }
    current = { screen: "requests" };
    await renderRequests();
    activate("requests");

  // Ask the sheet for this student's real statuses + replies
  let serverCache = null;
  async function fetchServer() {
    if (!SCRIPT_URL || !tg || !tg.initData) return null;
    try {
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "list", initData: tg.initData }) });
      const out = await res.json();
      return out.ok ? out.items : null;
    } catch (e) { return null; }
  }
  const STATUS_MAP = { "Waiting": "wait", "In progress": "progress", "Solved": "solved" };
  const KIND_MAP = { "Translation": "translation", "Behestan": "behestan", "Visa": "visa", "Fida Code": "fida" };

  function drawRequests(list) {
    const box = document.getElementById("reqList");
    if (!list.length) {
      box.innerHTML = `<div class="empty"><img src="${LOGO}" alt=""><p>${t("no_requests")}</p></div>`;
      return;
    }
    const cls = { wait: "wait", progress: "progress", solved: "solved" };
    box.innerHTML = list.map(r => {
      const d = new Date(r.date);
      const ds = isNaN(d) ? esc(r.date) : d.toLocaleDateString(lang === "ar" ? "ar-IQ" : "en-GB", { day: "numeric", month: "short", year: "numeric" });
      const what = r.keys ? [t(CAT_KEY[r.cat])].concat(r.keys.map(k => t(k))).join(" · ")
                          : [t(CAT_KEY[r.cat]) || r.cat, r.details].filter(Boolean).join(" · ");
      return `<div class="req">
        <div class="row"><span class="id">${esc(r.id)}</span><span class="date">${ds}</span></div>
        <div class="what">${esc(what)}</div>
        <span class="badge ${cls[r.status] || "wait"}">${t("st_" + (cls[r.status] || "wait"))}</span>
        ${r.reply ? `<div class="reply"><b>${t("reply")}</b> ${esc(r.reply)}</div>` : ""}
      </div>`;
    }).join("");

  async function renderRequests() {
    const local = await loadRequests();
    drawRequests(serverCache ? mergeRequests(local, serverCache) : local);   // show instantly
    const server = await fetchServer();                                      // then refresh from sheet
    if (server) {
      serverCache = server;
      if (current.screen === "requests") drawRequests(mergeRequests(local, server));
    }
  }
  // Sheet is the truth for status/reply; keep the nice labels from this phone when available
  function mergeRequests(local, server) {
    const byId = {}; local.forEach(r => byId[r.id] = r);
    const out = server.map(s => {
      const l = byId[s.id]; delete byId[s.id];
      return Object.assign({}, l || { id: s.id, cat: KIND_MAP[s.kind] || s.kind, date: s.date.replace(" ", "T"), details: s.details },
        { status: STATUS_MAP[s.status] || "wait", reply: s.reply });
    });
    return out.concat(Object.values(byId)).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  }

  function currentSeason() {
    const q = (new URLSearchParams(location.search).get("season") || SEASON_OVERRIDE || "").toLowerCase();
    if (["spring", "summer", "autumn", "winter"].includes(q)) return q;
    const d = new Date(), md = (d.getMonth() + 1) * 100 + d.getDate();
    if (md >= 321 && md < 622) return "spring";
    if (md >= 622 && md < 923) return "summer";
    if (md >= 923 && md < 1222) return "autumn";

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function makeParticles(box, cfg, count, small) {
    let html = "";
    for (let i = 0; i < count; i++) {
      const shape = cfg.shapes[i % cfg.shapes.length];
      const color = cfg.colors[Math.floor(Math.random() * cfg.colors.length)];
      const size = rnd(cfg.size[0], cfg.size[1]) * (small ? .8 : 1);
      const dur = small ? rnd(6, 10) : rnd(10, 20);
      const delay = -rnd(0, dur);
      const left = rnd(0, 100);
      const op = small ? rnd(.7, 1) : rnd(.35, .75);
      const inner = cfg.mode === "rise"
        ? `<span class="sway twinkle" style="--amp:${rnd(6, 16)}px;animation-duration:${rnd(1.5, 3)}s;width:${size}px;height:${size}px">${SHAPES[shape](color)}</span>`
        : `<span class="sway" style="--amp:${rnd(10, 30)}px;animation-duration:${rnd(2.5, 4.5)}s;width:${size}px;height:${size}px"><span class="spin" style="display:block;width:100%;height:100%;animation-duration:${rnd(5, 12)}s">${SHAPES[shape](color)}</span></span>`;
      html += `<span class="p ${cfg.mode}" style="left:${left}%;opacity:${op};animation-duration:${dur}s;animation-delay:${delay}s">${inner}</span>`;
    }
    box.innerHTML = html;
  }

  function toast(msg) {
    const el = document.getElementById("toast"); el.textContent = msg; el.style.display = "block";
    clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = "none", 2600);
  }
  function saveStaff() { try { localStorage.setItem(STAFF_KEY, JSON.stringify({ token: staff.token, name: staff.name, sections: staff.sections })); } catch (e) {} }
  function loadStaffSaved() { try { Object.assign(staff, JSON.parse(localStorage.getItem(STAFF_KEY)) || {}); } catch (e) {} }

  function openStaff() {
    loadStaffSaved();
    stack = []; 
    if (staff.token) { showStaffList(); loadStaff(); }
    else { current = { screen: "staffLogin" }; activate("staffLogin"); }
  }

  async function staffLogin() {
    const digits = s => s.replace(/[\u06F0-\u06F9]/g, c => c.charCodeAt(0) - 0x06F0).replace(/[\u0660-\u0669]/g, c => c.charCodeAt(0) - 0x0660);
    const u = digits(document.getElementById("stUser").value).replace(/\s+/g, "").toLowerCase();
    const p = digits(document.getElementById("stPass").value).trim();
    const err = document.getElementById("stErr");
    if (!u || !p) { err.textContent = t("err_login_fill"); err.style.display = "block"; return; }
    const btn = document.getElementById("stLoginBtn"); btn.disabled = true; btn.textContent = t("loading");
    try {
      const out = await api({ action: "login", username: u, password: p, initData: tg ? tg.initData : "" });
      if (!out.ok) {
        const known = { locked: "err_locked", no_user: "err_no_user", wrong_password: "err_wrong_password", inactive: "err_inactive" };
        err.textContent = known[out.error] ? t(known[out.error]) : "Server error: " + out.error;   // show real error, never hide it
        err.style.display = "block"; return;
      }
      err.style.display = "none";
      document.getElementById("stPass").value = "";
      Object.assign(staff, { token: out.token, name: out.name, sections: out.sections });
      saveStaff();
      staff.filter = "Waiting";
      showStaffList(); loadStaff();
    } catch (e) { err.textContent = t("err_net"); err.style.display = "block"; }
    finally { btn.disabled = false; btn.textContent = t("login"); }
  }

  function staffLogout() {
    staff = { token: "", name: "", sections: "", items: [], filter: "Waiting", openId: null, newStatus: null };
    try { localStorage.removeItem(STAFF_KEY); } catch (e) {}
    goHome();
  }
  function sessionOut() { toast(t("session_out")); staff.token = ""; try { localStorage.removeItem(STAFF_KEY); } catch (e) {} current = { screen: "staffLogin" }; activate("staffLogin"); }

  function showStaffList() {
    current = { screen: "staff" }; activate("staff");
    document.getElementById("stName").textContent = staff.name || "";
    document.getElementById("stSections").textContent = staff.sections || "";
    renderStaffList();
  }

  async function loadStaff() {
    if (!staff.items.length) document.getElementById("stList").innerHTML = `<p class="sub">${t("loading")}</p>`;
    try {
      const out = await api({ action: "admin_list", token: staff.token });
      if (!out.ok) return out.error === "session" ? sessionOut() : toast(out.error);
      staff.items = out.items; staff.name = out.name; staff.sections = out.sections; saveStaff();
      if (current.screen === "staff") showStaffList();
    } catch (e) { toast(t("err_net")); }
  }

  const ST_CLS = { "Waiting": "wait", "In progress": "progress", "Solved": "solved" };
  function renderStaffList() {
    const tabs = [["Waiting", "tab_wait"], ["In progress", "tab_progress"], ["Solved", "tab_solved"], ["All", "tab_all"]];
    const count = s => s === "All" ? staff.items.length : staff.items.filter(i => i.status === s).length;
    document.getElementById("stTabs").innerHTML = tabs.map(([s, k]) =>
      `<button class="tab ${staff.filter === s ? "on" : ""}" onclick="staff.filter='${s}';renderStaffList()">${t(k)}<b>${count(s)}</b></button>`).join("");
    const search = document.getElementById("stSearch"); search.placeholder = t("search_ph");
    const q = search.value.trim().toLowerCase();
    const list = staff.items.filter(i => (staff.filter === "All" || i.status === staff.filter) &&
      (!q || [i.name, i.passport, i.studentId, i.id].join(" ").toLowerCase().includes(q)));
    document.getElementById("stList").innerHTML = list.length ? list.map(i => `
      <button class="req st-card" onclick="openStaffReq('${esc(i.id)}')">
        <div class="row"><span class="id">${esc(i.id)}</span><span class="date">${esc(i.date)}</span></div>
        <div class="what"><b>${esc(i.name)}</b> · ${esc(i.kind)}${i.details ? " · " + esc(i.details) : ""}</div>
        <span class="badge ${ST_CLS[i.status] || "wait"}">${t("st_" + (ST_CLS[i.status] || "wait"))}</span>
      </button>`).join("") : `<div class="empty"><img src="${LOGO}" alt=""><p>${t("st_empty")}</p></div>`;
  }

  function openStaffReq(id) {
    const i = staff.items.find(x => x.id === id); if (!i) return;
    staff.openId = id; staff.newStatus = i.status === "Waiting" ? "In progress" : i.status;
    current = { screen: "staffReq" }; activate("staffReq");
    renderStaffReq();
  }
  function renderStaffReq() {
    const i = staff.items.find(x => x.id === staff.openId); if (!i) return;
    const rows = [["k_ticket", i.id], ["k_kind", i.kind], ["k_date", i.date], ["k_name", i.name], ["k_passport", i.passport],
      ["k_studentId", i.studentId], ["k_semester", i.semester], ["k_level", i.level], ["k_field", i.field],
      ["k_details", i.details], ["k_returned", i.returned], ["k_place", i.place], ["k_note", i.note], ["k_assigned", i.assigned]]
      .filter(r => r[1]);
    const pills = ["Waiting", "In progress", "Solved"].map(s =>
      `<button type="button" class="pill ${staff.newStatus === s ? "on" : ""}" onclick="staff.newStatus='${s}';renderStaffReq()">${t("st_" + ST_CLS[s]).replace(/^\S+\s/, "")}</button>`).join("");
    const typed = document.getElementById("stReply");
    const replyVal = typed ? typed.value : i.reply;
    document.getElementById("stReq").innerHTML = `
      <h2>${esc(i.name)}</h2>
      <span class="badge ${ST_CLS[i.status] || "wait"}">${t("st_" + (ST_CLS[i.status] || "wait"))}</span>
      <dl class="kv">${rows.map(r => `<dt>${t(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
      ${i.hasPhoto ? `<button class="ghost-btn" id="photoBtn" onclick="loadPhoto('${esc(i.id)}')">${t("show_photo")}</button><div class="photo-box" id="photoBox"></div>` : ""}
      <h2 style="margin-top:22px">${t("answer_title")}</h2>
      <label>${t("status_label")}</label><div class="pills">${pills}</div>
      <label>${t("reply")}</label><textarea id="stReply" placeholder="${esc(t("reply_ph"))}">${esc(replyVal || "")}</textarea>
      <button class="main-btn" id="stSendBtn" onclick="sendAnswer()">${t("send_answer")}</button>`;
    if (staff.photo && staff.photo.id === i.id) document.getElementById("photoBox").innerHTML = `<img src="${staff.photo.src}" alt="">`;
  }
  async function loadPhoto(id) {
    const b = document.getElementById("photoBtn"); b.disabled = true; b.textContent = t("loading");
    try {
      const out = await api({ action: "admin_photo", token: staff.token, id });
      if (!out.ok) return out.error === "session" ? sessionOut() : toast(out.error);
      staff.photo = { id, src: out.image };
      document.getElementById("photoBox").innerHTML = `<img src="${out.image}" alt="">`;
      b.style.display = "none";
    } catch (e) { toast(t("err_net")); b.disabled = false; b.textContent = t("show_photo"); }
  }
  async function sendAnswer() {
    const btn = document.getElementById("stSendBtn"); btn.disabled = true; btn.textContent = t("sending");
    const reply = document.getElementById("stReply").value.trim();
    try {
      const out = await api({ action: "admin_answer", token: staff.token, id: staff.openId, status: staff.newStatus, reply });
      if (!out.ok) { btn.disabled = false; btn.textContent = t("send_answer"); return out.error === "session" ? sessionOut() : toast(out.error); }
      const i = staff.items.find(x => x.id === staff.openId); i.status = staff.newStatus; i.reply = reply;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      toast(t("sent_ok"));
      showStaffList(); loadStaff();
    } catch (e) { btn.disabled = false; btn.textContent = t("send_answer"); toast(t("err_net")); }
  }

  applySeason();
  applyLang();
  if (new URLSearchParams(location.search).get("staff") === "1") openStaff();
</script>
</body>
</html>
